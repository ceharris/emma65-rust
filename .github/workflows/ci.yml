name: CI

on:
  pull_request:
  merge_group:

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      debugger: ${{ steps.filter.outputs.debugger }}
      display: ${{ steps.filter.outputs.display }}
      led-matrix: ${{ steps.filter.outputs.led-matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            debugger:
              - 'debugger/**'
            display:
              - 'display/**'
            led-matrix:
              - 'led-matrix/**'

  ci:
    name: Build, Clippy, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p emma65

      - name: Clippy
        run: cargo clippy -p emma65 --all-targets -- -D warnings

      - name: Test
        run: cargo test -p emma65

  ci-debugger:
    name: Debugger Build and Clippy
    needs: changes
    if: needs.changes.outputs.debugger == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build
        run: cargo build -p emma65-debugger

      - name: Clippy
        working-directory: debugger/src-tauri
        run: cargo clippy -- -D warnings

  ci-display:
    name: Display Build and Clippy
    needs: changes
    if: needs.changes.outputs.display == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install SDL2 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Build
        run: cargo build -p emma65-display

      - name: Clippy
        run: cargo clippy -p emma65-display --all-targets -- -D warnings

  ci-led-matrix:
    name: LED Matrix Build and Clippy
    needs: changes
    if: needs.changes.outputs.led-matrix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install SDL2 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-gfx-dev

      - name: Build
        run: cargo build -p emma65-led-matrix

      - name: Clippy
        run: cargo clippy -p emma65-led-matrix --all-targets -- -D warnings
