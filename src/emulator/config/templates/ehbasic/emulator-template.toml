# Bundled EhBASIC starter-profile configuration for emma65. 
# This is a TEMPLATE: {{ROM_IMAGE}} and {{LABELS}} are replaced 
# with materialized paths when the profile is instantiated.

cpu-variant = "WDC65C02"
clock-speed-hz = 1843200

[[devices]]
type = "ram"
address = 0x0000
size = 49152

[[devices]]
type = "rom"
address = 0xD000
size = 12288
image = "{{ROM_IMAGE}}"
labels = "{{LABELS}}"

[[devices]]
type = "via/6522"
address = 0xCFF0

[[devices]]
type = "console"
address = 0xFFF8
